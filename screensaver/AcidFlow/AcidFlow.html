<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }

    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    font: 13px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;

    padding: 10px 18px; border-radius: 999px; letter-spacing: 0.02em;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    opacity: 1; transition: opacity 1.2s ease; pointer-events: none; white-space: nowrap;

  #hint b { color: #fff; font-weight: 600; }

<script id="vs" type="x-shader/x-vertex">#version 300 es
precision highp float;
const vec2 verts[3] = vec2[3](vec2(-1.0,-1.0), vec2(3.0,-1.0), vec2(-1.0,3.0));
out vec2 vUv;
void main() {
  vec2 p = verts[gl_VertexID];
  vUv = p * 0.5 + 0.5;
  gl_Position = vec4(p, 0.0, 1.0);
}
</script>

<script id="common" type="x-shader/x-common">
// Gradient noise (Inigo Quilez style), smooth C2 interpolation
vec2 hash2(vec2 p) {
  p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
  return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);
}
float gnoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  return mix(mix(dot(hash2(i + vec2(0.0, 0.0)), f - vec2(0.0, 0.0)),
                 dot(hash2(i + vec2(1.0, 0.0)), f - vec2(1.0, 0.0)), u.x),
             mix(dot(hash2(i + vec2(0.0, 1.0)), f - vec2(0.0, 1.0)),
                 dot(hash2(i + vec2(1.0, 1.0)), f - vec2(1.0, 1.0)), u.x), u.y);
}
const mat2 ROT = mat2(0.80, 0.60, -0.60, 0.80);
float fbm(vec2 p) {
  float a = 0.5, s = 0.0;
  for (int i = 0; i < 5; i++) {
    s += a * gnoise(p);
    p = ROT * p * 2.02 + vec2(1.7, 9.2);
    a *= 0.5;
  }
  return s;
}
float fbm3(vec2 p) {
  float a = 0.5, s = 0.0;
  for (int i = 0; i < 3; i++) {
    s += a * gnoise(p);
    p = ROT * p * 2.03 + vec2(3.1, 2.7);
    a *= 0.5;
  }
  return s;
}
</script>

<script id="fs_sim" type="x-shader/x-fragment">#version 300 es
precision highp float;
in vec2 vUv;
out vec4 frag;

uniform sampler2D uPrev;
uniform sampler2D uPal0;     // current palette (1D gradient)
uniform sampler2D uPal1;     // next palette
uniform sampler2D uInk;      // Mystify lines rendered by the 2D canvas, injected into the flow
uniform float uPalMix;
uniform float uInkAmount;
uniform vec2  uRes;
uniform float uDt;
uniform float uFrame;
uniform vec2  uOff1;     // flow field drift (bounded, computed in JS)
uniform vec2  uOff2;     // warp drift
uniform vec2  uOff3;     // warp drift 2
uniform float uHue;      // palette phase
uniform float uFlow;     // advection strength
uniform float uSwirl;    // global rotation
uniform float uZoom;     // slow zoom in/out
uniform float uInject;   // how fast fresh colour is written
uniform float uScale;    // spatial scale of the pattern
uniform float uWarp;     // domain warp intensity

// eruptions: a shock wave pushes the fluid outward, then a kaleidoscopic bloom is written over it
const int MAX_ERUPT = 6;
uniform int   uEruptN;
uniform vec4  uEruptA[MAX_ERUPT];   // centre (p-space), phase 0..1, strength
uniform vec4  uEruptB[MAX_ERUPT];   // hue offset, ring radius, rotation, symmetry folds
uniform vec4  uEruptC[MAX_ERUPT];   // x = takeover: the drop swallows the whole picture and brings the next palette
uniform float uEruptInject;         // how fast the bloom overwrites the fluid

// bubbles: thin soap bubbles whose rim bleeds into the fluid, so the picture itself carries their ghosts away
const int MAX_BUB = 16;
uniform int   uBubN;
uniform vec4  uBubA[MAX_BUB];       // centre (p-space), radius, alpha
uniform vec4  uBubB[MAX_BUB];       // hue offset, iridescence rotation, pop 0..1
uniform float uBubInk;              // how strongly the rim is written into the fluid per frame

//COMMON//

vec3 pal(float t) {
  vec2 uv = vec2(t, 0.5);
  return mix(texture(uPal0, uv).rgb, texture(uPal1, uv).rgb, uPalMix);
}

vec2 curl(vec2 p) {
  const float e = 0.02;
  float a = fbm3(p + vec2(0.0, e));
  float b = fbm3(p - vec2(0.0, e));
  float c = fbm3(p + vec2(e, 0.0));
  float d = fbm3(p - vec2(e, 0.0));
  return vec2(a - b, -(c - d)) / (2.0 * e);
}

void main() {
  vec2 asp = vec2(uRes.x / uRes.y, 1.0);
  vec2 p = (vUv - 0.5) * asp;

  // ---- flow field: divergence-free curl noise + gentle global swirl
  vec2 v = curl(p * 0.9 + uOff1) * uFlow;
  v += vec2(-p.y, p.x) * uSwirl;
  v += p * uZoom;

  // ---- eruptions
  vec3 bloom = vec3(0.0);
  float bloomMask = 0.0;
  for (int i = 0; i < MAX_ERUPT; i++) {
    if (i >= uEruptN) break;
    vec4 A = uEruptA[i], B = uEruptB[i];
    float big = uEruptC[i].x;
    vec2 d = p - A.xy;
    float r = length(d);
    float phase = A.z, str = max(A.w, 0.3), R = B.y;
    if (r > R * 1.8 + 0.25) continue;
    vec2 dir = d / max(r, 1e-4);
    // 1) while the dimple sinks nothing happens in the fluid: it is drawn at display time in fs_show
    // 2) the colour wells up from inside and gently pushes the surroundings away, no ring, soft everywhere
    float pop = smoothstep(0.18, 0.26, phase);
    float push = exp(-r * r / (R * R + 1e-4)) * smoothstep(0.0, 0.2 * R, r);
    v += dir * push * pop * str * mix(0.25, 0.5, big) * (1.0 - smoothstep(mix(0.4, 0.55, big), mix(0.6, 0.7, big), phase));
    // kaleidoscopic mandala inside the ring
    float rawAng = atan(d.y, d.x) + B.z;
    float ang = rawAng;
    if (B.w > 0.5) {
      float seg = 6.2831853 / B.w;
      ang = abs(mod(rawAng + seg * 0.5, seg) - seg * 0.5);
    }
    vec2 q2 = vec2(cos(ang), sin(ang)) * r;
    // a takeover drop zooms its pattern up as it grows, so the whole screen gets a few bold rings instead of grain
    float fs = mix(1.0, clamp(0.12 / max(R, 1e-3), 0.08, 1.0), big);
    float n = fbm3(q2 * (34.0 * fs / str) + vec2(B.x * 3.0, phase * 2.0));
    float rings = 0.5 + 0.5 * sin(r * (170.0 * fs / str) - phase * 25.0 + n * 7.0);
    float petals = 0.5 + 0.5 * cos(rawAng * max(B.w, 3.0) * 2.0 + r * 85.0 * fs - phase * 8.0 + n * 4.0);
    // dark gaps between the bright bands: a readable mandala instead of a pastel disc
    float pattern = smoothstep(0.15, 0.85, rings) * (0.35 + 0.65 * smoothstep(0.2, 0.8, petals));
    vec3 bc = pal(B.x + n * 2.2 + rings * 0.6 + r * 4.0 * fs / str);
    bc = pow(bc, vec3(0.75)) * (0.35 + 1.4 * pattern);
    bc += vec3(1.0, 0.95, 0.85) * exp(-r * r / (0.0004 * str)) * pop * (1.0 - phase);   // soft glow at the core
    // 3) the colour is stamped with a gaussian edge that grows from the centre, briefly, then the flow takes it apart
    //    a takeover drop keeps growing (R comes from JS) until the gaussian covers the whole screen
    float Rb = R * mix(smoothstep(0.18, 0.45, phase), 1.0, big) + 1e-4;
    float inside = exp(-2.0 * r * r / (Rb * Rb));
    float m = inside * pop * (1.0 - smoothstep(mix(0.45, 0.62, big), mix(0.65, 0.75, big), phase));
    bloom = mix(bloom, bc, m);
    bloomMask = max(bloomMask, m);
  }

  vec2 suv = vUv - (v * uDt) / asp;
  // slight blur kernel while sampling: keeps the field silky, prevents pixel crawl
  vec2 px = 0.6 / uRes;
  vec3 prev = texture(uPrev, suv).rgb * 0.68
            + texture(uPrev, suv + vec2(px.x, 0.0)).rgb * 0.08
            + texture(uPrev, suv - vec2(px.x, 0.0)).rgb * 0.08
            + texture(uPrev, suv + vec2(0.0, px.y)).rgb * 0.08
            + texture(uPrev, suv - vec2(0.0, px.y)).rgb * 0.08;

  // ---- source: domain-warped fbm (iq), coloured by the palette gradient
  vec2 q = p * uScale;
  vec2 w1 = vec2(fbm(q + uOff2), fbm(q + uOff2 + vec2(5.2, 1.3)));
  vec2 w2 = vec2(fbm(q + uWarp * w1 + uOff3 + vec2(1.7, 9.2)),
                 fbm(q + uWarp * w1 + uOff3 + vec2(8.3, 2.8)));
  float f = fbm(q + uWarp * w2);
  float t = f * 1.7 + uHue + 0.45 * length(w2) + 0.2 * w1.x;
  vec3 src = pal(t);
  // depth: slow dark pools and bright folds so the image has real contrast, not pastel soup
  float dark = smoothstep(-0.35, 0.40, fbm3(q * 0.55 + uOff1 * 0.7 + vec2(3.0, 7.0)));
  src *= 0.15 + 0.95 * dark;
  src *= 0.80 + 0.40 * smoothstep(0.25, 0.95, length(w2));

  vec3 col = (uFrame < 1.5) ? src : mix(prev, src, uInject);

  // ---- ink: the line shapes bleed into the fluid and get carried away by it
  vec4 ink = texture(uInk, vec2(vUv.x, 1.0 - vUv.y));
  col += ink.rgb * ink.a * uInkAmount;

  // ---- bubble rims: a soft iridescent ring is written where each bubble sits; a pop writes a burst of it
  for (int i = 0; i < MAX_BUB; i++) {
    if (i >= uBubN) break;
    vec4 A = uBubA[i], B = uBubB[i];
    vec2 d = p - A.xy;
    float r = length(d), R = A.z;
    if ((A.w <= 0.001 && B.z <= 0.001) || r > R * 1.4) continue;
    float nr = r / max(R, 1e-4);
    float rim = exp(-pow((nr - 1.0) / 0.07, 2.0));
    float ang = atan(d.y, d.x) + B.y * 6.2831853;
    vec3 rc = pal(B.x + 0.12 * cos(ang) + nr * 0.3);
    // while it lives the rim seeps in faintly; a pop writes a burst of it regardless of how faint the bubble already is
    col += rc * rim * uBubInk * (A.w + 10.0 * B.z);
  }

  // ---- eruption bloom overwrites the fluid, then gets carried away by it
  col = mix(col, bloom, bloomMask * uEruptInject);

  col = clamp(col, 0.0, 1.3);
  frag = vec4(col, 1.0);
}
</script>

<script id="fs_show" type="x-shader/x-fragment">#version 300 es
precision highp float;
in vec2 vUv;
out vec4 frag;
uniform sampler2D uTex;
uniform vec2  uRes;
uniform float uTime;
uniform float uSat;
uniform float uGamma;
uniform float uGain;
uniform float uVignette;
uniform float uPulse;     // 0..1 flash right after an eruption
uniform float uKal;       // 0..1 whole-screen kaleidoscope (breakthrough)
uniform float uKalSym;    // folds
uniform float uKalRot;    // rotation of the fold
// inverted drops: while an eruption swells the picture sinks into a soft dimple, a gaussian lens with no edge
const int MAX_ERUPT = 6;
uniform int   uEruptN;
uniform vec4  uEruptA[MAX_ERUPT];   // centre (p-space), phase 0..1, strength
uniform vec4  uEruptB[MAX_ERUPT];   // hue offset, radius, rotation, symmetry
// bubbles: thin soap bubbles. A glass lens bulges the picture inside, a thin iridescent fresnel rim and one highlight
const int MAX_BUB = 16;
uniform int   uBubN;
uniform vec4  uBubA[MAX_BUB];       // centre (p-space), radius, alpha
uniform vec4  uBubB[MAX_BUB];       // hue offset, iridescence rotation, pop 0..1
uniform float uBubRim;              // rim brightness
uniform float uBubLens;             // refraction strength inside
uniform float uBubThick;            // rim thickness multiplier
uniform sampler2D uPal0;
uniform sampler2D uPal1;
uniform float uPalMix;

float hash1(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
vec3 pal(float t) {
  vec2 uv = vec2(t, 0.5);
  return mix(texture(uPal0, uv).rgb, texture(uPal1, uv).rgb, uPalMix);
}

// chromatic bloom: sample neighbours with slight offset per channel; the spread widens during a pulse
vec3 fetch(vec2 uv, float spread) {
  vec3 col = texture(uTex, uv).rgb;
  vec2 px = spread / uRes;
  vec3 bl = vec3(
    texture(uTex, uv + px * vec2( 1.0, 0.0)).r,
    texture(uTex, uv + px * vec2(-0.5, 0.8)).g,
    texture(uTex, uv + px * vec2(-0.5,-0.8)).b);
  return mix(col, bl, 0.25 + 0.35 * uPulse);
}

void main() {
  float spread = 1.5 + 10.0 * uPulse;

  // inverted drops
  vec2 bAsp = vec2(uRes.x / uRes.y, 1.0);
  vec2 bp = (vUv - 0.5) * bAsp;
  vec2 uv = vUv;
  float shade = 1.0;
  for (int i = 0; i < MAX_ERUPT; i++) {
    if (i >= uEruptN) break;
    vec4 A = uEruptA[i], B = uEruptB[i];
    float phase = A.z, R = B.y;
    float vis = smoothstep(0.0, 0.05, phase) * (1.0 - smoothstep(0.22, 0.32, phase));
    if (vis <= 0.0) continue;
    vec2 d = bp - A.xy;
    float r = length(d);
    if (r > R * 2.5) continue;
    float g = exp(-r * r / (0.6 * R * R + 1e-6));
    uv += (d / bAsp) * 0.8 * g * vis;                // the picture sinks away from the viewer: a dimple, no edge
    shade *= 1.0 - 0.35 * g * vis;                    // and darkens a little towards the bottom of it
  }

  // bubbles: lens first (moves the sample point), rim and highlight are added on top afterwards
  vec3 rimCol = vec3(0.0);
  float film = 0.0;
  const vec2 hdir = vec2(-0.62, 0.78);              // light from the top left
  for (int i = 0; i < MAX_BUB; i++) {
    if (i >= uBubN) break;
    vec4 A = uBubA[i], B = uBubB[i];
    float al = A.w, R = A.z;
    if (al <= 0.001 && B.z <= 0.001) continue;
    vec2 d = bp - A.xy;
    float r = length(d);
    if (r > R * 1.25) continue;
    float nr = r / max(R, 1e-4);
    float inside = 1.0 - smoothstep(0.90, 1.0, nr);
    // glass: the picture bulges towards the viewer, most near the edge, like looking through a sphere
    float bulge = nr * nr * nr;
    uv -= (d / bAsp) * 0.18 * uBubLens * bulge * inside * al;
    // thin fresnel rim: thickness relative to the bubble, never thinner than about 1.5 px
    float w = max(0.028 * uBubThick, 1.6 / (uRes.y * max(R, 1e-3)));
    float rim = exp(-pow((nr - 0.985) / w, 2.0));
    rim += 0.25 * exp(-pow((nr - 0.96) / (w * 3.5), 2.0)) * (1.0 - smoothstep(0.98, 1.02, nr));   // a whisper of film just inside
    // iridescence: the palette runs around the circumference and slowly turns
    float ang = atan(d.y, d.x) + B.y * 6.2831853;     // continuous around the circle, no seam, turns slowly
    vec3 rc = pal(B.x + 0.12 * cos(ang) + nr * 0.25);
    rc = mix(rc, vec3(1.0), 0.30);
    // one soft highlight where the light hits
    vec2 nd = d / max(r, 1e-4);
    float spec = pow(max(dot(nd, hdir), 0.0), 14.0) * exp(-pow((nr - 0.86) / 0.10, 2.0));
    float popFlash = 1.0 + 1.5 * B.z;
    rimCol += (rc * rim * 0.85 + vec3(1.0, 0.98, 0.95) * spec * 0.7) * al * uBubRim * popFlash;
    film = max(film, 0.05 * inside * al);
  }
  vec3 col = fetch(uv, spread) * shade;
  col = col * (1.0 + film) + rimCol;

  // breakthrough: fold the whole picture kaleidoscopically around the centre and cross-fade to it
  if (uKal > 0.001) {
    vec2 asp = vec2(uRes.x / uRes.y, 1.0);
    vec2 d = (vUv - 0.5) * asp;
    float r = length(d);
    float seg = 6.2831853 / max(uKalSym, 2.0);
    float ang = abs(mod(atan(d.y, d.x) + uKalRot + seg * 0.5, seg) - seg * 0.5);
    r *= 1.0 + 0.12 * uKal * sin(r * 9.0 - uTime * 2.5);   // breathing zoom, folds pulse towards the viewer
    vec2 kuv = vec2(cos(ang), sin(ang)) * r / asp + 0.5;
    col = mix(col, fetch(kuv, spread), uKal);
  }

  // saturation
  float l = dot(col, vec3(0.299, 0.587, 0.114));
  col = mix(vec3(l), col, uSat * (1.0 + 0.5 * uPulse));
  col *= 1.0 + 0.4 * uPulse;

  // contrast: deepen the darks, keep the highlights glowing
  col = pow(max(col, 0.0), vec3(1.45)) * 1.25;
  col = col / (col + 0.60) * 1.50;
  col = pow(max(col, 0.0), vec3(uGamma)) * uGain;

  // vignette
  vec2 d = vUv - 0.5;
  d.x *= uRes.x / uRes.y;
  float vig = 1.0 - smoothstep(0.45, 1.35, length(d));
  col *= mix(1.0, 0.45 + 0.55 * vig, uVignette);

  // slow breathing
  col *= 0.96 + 0.04 * sin(uTime * 0.21);

  // dither against banding
  col += (hash1(gl_FragCoord.xy + fract(uTime) * 17.0) - 0.5) / 255.0 * 2.0;

  frag = vec4(col, 1.0);
}
</script>

<script>
function acidMain() {
  'use strict';

  // =====================================================================================
  //  SETTINGS
  //  Defaults live here. They are overridden, in this order, by:
  //    1. window.ACID_SETTINGS_TEXT  (the .scr host injects the contents of settings.json)
  //    2. a settings.json next to this file when served over http(s)
  //    3. URL parameters: ?fps= ?scale= ?maxscale= ?speed= ?palette= ?hint=0 ?saver=1
  //  settings.json may contain // comments and trailing commas.
  // =====================================================================================
  const DEFAULTS = {
    fps: 30,                 // frame rate cap, 10..60
    quality: 0.75,           // max render resolution as a fraction of the screen, 0.35..1
    speed: 1.0,              // global time multiplier (0.25 = very slow, 2 = energetic)
    flow: 1.0,               // strength of the fluid motion
    swirl: 1.0,              // global rotation
    detail: 1.0,             // spatial scale of the pattern (2 = smaller features)
    warp: 1.0,               // how much the pattern folds over itself
    colorShift: 1.0,         // how fast hues drift through the palette
    saturation: 1.0,
    brightness: 1.0,
    vignette: 1.0,           // 0 = off
    paletteSeconds: 150,     // time each palette stays before morphing to the next
    morphSeconds: 40,        // cross-fade length
    palettes: [],            // [] = all built-in. Or a list of names and/or {name, colors:[hex...]} objects.
    bubbles: {
      enabled: true,
      count: 8,              // bubbles on screen at most, 1..16
      everySeconds: 2.5,     // average seconds between new bubbles
      size: 1.0,             // radius multiplier
      life: 16,              // seconds a bubble lives (randomised 0.7x..1.3x)
      rise: 1.0,             // upward drift speed
      thickness: 1.0,        // rim thickness
      opacity: 1.0,          // rim brightness in the picture (0 = no crisp rim, only the ink)
      lens: 1.0,             // refraction inside the bubble (0 = flat)
      ink: 1.0,              // how strongly the rim bleeds into the fluid (0 = off)
      pop: 0.5,              // share of bubbles that pop instead of fading out, 0..1
    },
    mystify: {
      enabled: false,
      shapes: 2,             // number of polygons
      points: 4,             // vertices per polygon
      speed: 1.0,            // movement speed
      trail: 12,             // trailing copies
      trailSpacing: 3,       // frames between trailing copies
      lineWidth: 1.4,        // pixels at 1080p
      opacity: 0.35,         // crisp overlay opacity (0 = overlay off)
      ink: 1.0,              // how strongly the lines bleed into the fluid (0 = off)
    },
    eruptions: {
      enabled: false,         // off since 1.3.1: bubbles only. E/B/T keys still fire them by hand
      everySeconds: 10,      // average seconds between eruptions (randomised 0.5x..1.5x)
      intensity: 1.0,        // size of the drop and strength of its ripple
      duration: 8,           // seconds a drop lives: bubble, plop, then the flow takes the colour apart
      symmetry: 6,           // kaleidoscope folds in the bloom (0 = none)
      breakthroughEverySeconds: 240,  // whole-screen kaleidoscope (0 = off)
      breakthroughSeconds: 10,
      takeoverEverySeconds: 240,      // a drop that swallows the whole picture and brings the next palette (0 = off)
      takeoverSeconds: 12,
    },
  };

  const BUILTIN_PALETTES = [
    // cosine palettes: a + b*cos(2pi(c*t+d)), evaluated in JS into a gradient texture
    { name: 'Prism',       a: [0.50, 0.50, 0.50], b: [0.50, 0.50, 0.50], c: [1.00, 1.00, 1.00], d: [0.00, 0.33, 0.67] },
    { name: 'Lava lamp',   a: [0.55, 0.35, 0.45], b: [0.45, 0.40, 0.50], c: [1.00, 0.70, 0.40], d: [0.00, 0.15, 0.20] },
    { name: 'Deep sea',    a: [0.20, 0.25, 0.50], b: [0.50, 0.45, 0.45], c: [1.00, 1.00, 0.80], d: [0.35, 0.55, 0.85] },

      bubA[i * 4] = (b.x - 0.5) * aspect; bubA[i * 4 + 1] = b.y - 0.5;
      bubA[i * 4 + 2] = R; bubA[i * 4 + 3] = alpha;
      bubB[i * 4] = b.hue; bubB[i * 4 + 1] = b.rot + b.rotSpeed * age; bubB[i * 4 + 2] = pop; bubB[i * 4 + 3] = 0;
    }
  }
  function popAll() {
    for (const b of bubbles) { b.pops = true; b.dur = Math.min(b.dur, state.simTime - b.t0 + POP_SECONDS); }
  }

  // ---- Mystify-style line shapes ---------------------------------------------------------
  const M = {
    shapes: clamp(Math.round(num(S.mystify.shapes, 2)), 1, 8),
    points: clamp(Math.round(num(S.mystify.points, 4)), 3, 8),
    speed: clamp(num(S.mystify.speed, 1), 0, 5),
    trail: clamp(Math.round(num(S.mystify.trail, 12)), 0, 60),
    spacing: clamp(Math.round(num(S.mystify.trailSpacing, 3)), 1, 10),
    width: clamp(num(S.mystify.lineWidth, 1.4), 0.3, 12),
    opacity: clamp(num(S.mystify.opacity, 0.35), 0, 1),
    ink: clamp(num(S.mystify.ink, 1.0), 0, 3),
  };
  const shapes = [];
  function rnd(a, b) { return a + Math.random() * (b - a); }
  for (let i = 0; i < M.shapes; i++) {
    const pts = [];
    for (let j = 0; j < M.points; j++) {
      const ang = rnd(0, Math.PI * 2), sp = rnd(0.05, 0.09);
      pts.push({ x: rnd(0.1, 0.9), y: rnd(0.1, 0.9), vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp });
    }
    shapes.push({ pts, history: [], hue: i / M.shapes, hueDrift: rnd(0.004, 0.009) * (i % 2 ? 1 : -1), frameCount: 0 });
  }
  const inkCanvas = document.createElement('canvas');
  const inkCtx = inkCanvas.getContext('2d');
  const linesCtx = linesCanvas.getContext('2d');
  const inkTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, inkTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 0]));
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  let inkDirty = true;

  function stepShapes(dt, P) {
    const aspect = canvas.width / Math.max(1, canvas.height);
    for (const sh of shapes) {
      // velocities live in "height units" per second; x bounces at the aspect-corrected edge
      for (const p of sh.pts) {
        p.x += p.vx * dt * M.speed / aspect;
        p.y += p.vy * dt * M.speed;
        if (p.x < 0) { p.x = -p.x; p.vx = Math.abs(p.vx); }
        if (p.x > 1) { p.x = 2 - p.x; p.vx = -Math.abs(p.vx); }
        if (p.y < 0) { p.y = -p.y; p.vy = Math.abs(p.vy); }
        if (p.y > 1) { p.y = 2 - p.y; p.vy = -Math.abs(p.vy); }
      }
      sh.hue += sh.hueDrift * dt;
      if (++sh.frameCount % M.spacing === 0) {
        sh.history.unshift(sh.pts.map(p => [p.x, p.y]));
        if (sh.history.length > M.trail) sh.history.length = M.trail;
      }
    }
  }
  function drawShapes(ctx, w, h, alphaScale, widthScale, P) {
    ctx.clearRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(0.5, M.width * (h / 1080) * widthScale);
    for (const sh of shapes) {
      const poly = (pts, alpha, hueOff) => {
        const c = paletteColor(P, sh.hue + hueOff);
        ctx.strokeStyle = 'rgba(' + Math.round(c[0] * 255) + ',' + Math.round(c[1] * 255) + ',' + Math.round(c[2] * 255) + ',' + alpha.toFixed(3) + ')';
        ctx.beginPath();
        for (let i = 0; i < pts.length; i++) { const x = pts[i][0] * w, y = pts[i][1] * h; if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); }
        ctx.closePath();
        ctx.stroke();
      };
      for (let i = sh.history.length - 1; i >= 0; i--) {
        const a = (1 - (i + 1) / (M.trail + 1));
        poly(sh.history[i], alphaScale * a * a * 0.9, i * 0.012);
      }
      poly(sh.pts.map(p => [p.x, p.y]), alphaScale, 0);
    }
  }
  function renderLines(P) {
    const on = state.linesOn && M.shapes > 0;
    if (M.opacity > 0 && on) {
      if (linesCanvas.width !== canvas.width || linesCanvas.height !== canvas.height) { linesCanvas.width = canvas.width; linesCanvas.height = canvas.height; }
      linesCanvas.style.display = '';
      drawShapes(linesCtx, linesCanvas.width, linesCanvas.height, M.opacity, 1, P);
    } else if (linesCanvas.style.display !== 'none') {
      linesCanvas.style.display = 'none';
    }
    if (M.ink > 0 && on) {
      const iw = Math.max(64, Math.round(simW * 0.5)), ih = Math.max(64, Math.round(simH * 0.5));
      if (inkCanvas.width !== iw || inkCanvas.height !== ih) { inkCanvas.width = iw; inkCanvas.height = ih; }
      drawShapes(inkCtx, iw, ih, 1.0, 2.2, P);
      gl.activeTexture(gl.TEXTURE3);
      gl.bindTexture(gl.TEXTURE_2D, inkTex);
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, inkCanvas);
      inkDirty = false;
    } else if (!inkDirty) {
      gl.activeTexture(gl.TEXTURE3);
      gl.bindTexture(gl.TEXTURE_2D, inkTex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 0]));
      inkDirty = true;
    }
  }

  // ---- resizing
  function resize(force) {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    const cw = Math.max(1, Math.floor(canvas.clientWidth * dpr));
    const ch = Math.max(1, Math.floor(canvas.clientHeight * dpr));
    if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }
    const w = Math.max(64, Math.floor(cw * state.renderScale));
    const h = Math.max(64, Math.floor(ch * state.renderScale));
    if (!force && w === simW && h === simH) return;
    const old = targets;
    targets = [makeTarget(w, h), makeTarget(w, h)];
    if (!targets[0].ok) {
      targets.forEach(destroyTarget);
      texInternal = gl.RGBA8; texType = gl.UNSIGNED_BYTE;
      targets = [makeTarget(w, h), makeTarget(w, h)];
    }
    simW = w; simH = h;
    if (old.length) {
      // carry the existing picture over into the new resolution (no visual reset)
      step(0, old[0].tex, targets[0], true);
      old.forEach(destroyTarget);
    } else {
      state.frame = 0;
    }
  }

  // ---- one simulation step: read from prevTex, write to dst
  function step(dt, prevTex, dst, carryOnly) {
    const m = mod(state.simTime);
    const P = currentPalette(state.simTime);
    gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fbo);
    gl.viewport(0, 0, simW, simH);
    gl.useProgram(simProg.p);
    const u = simProg.u;
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, prevTex);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, palTex[P.i0].tex);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, palTex[P.i1].tex);
    gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, inkTex);
    gl.uniform1i(u.uPrev, 0);
    gl.uniform1i(u.uPal0, 1);
    gl.uniform1i(u.uPal1, 2);
    gl.uniform1i(u.uInk, 3);
    gl.uniform1f(u.uPalMix, P.f);
    gl.uniform1f(u.uInkAmount, carryOnly ? 0.0 : 0.03 * M.ink);
    gl.uniform2f(u.uRes, simW, simH);
    gl.uniform1f(u.uDt, dt);
    gl.uniform1f(u.uFrame, carryOnly ? 10 : state.frame);
    gl.uniform2f(u.uOff1, m.off1[0], m.off1[1]);
    gl.uniform2f(u.uOff2, m.off2[0], m.off2[1]);
    gl.uniform2f(u.uOff3, m.off3[0], m.off3[1]);
    gl.uniform1f(u.uHue, m.hue);
    gl.uniform1f(u.uFlow, m.flow);
    gl.uniform1f(u.uSwirl, m.swirl);
    gl.uniform1f(u.uZoom, m.zoom);
    gl.uniform1f(u.uInject, (carryOnly || state.fx.freeze) ? 0.0 : m.inject);
    gl.uniform1f(u.uScale, m.scale);
    gl.uniform1f(u.uWarp, m.warp);
    gl.uniform1i(u.uEruptN, carryOnly ? 0 : state.fx.n);
    gl.uniform4fv(u.uEruptA, eruptA);
    gl.uniform4fv(u.uEruptB, eruptB);
    gl.uniform4fv(u.uEruptC, eruptC);
    gl.uniform1f(u.uEruptInject, 0.3);
    const bubN = (carryOnly || !state.bubblesOn) ? 0 : bubbles.length;
    gl.uniform1i(u.uBubN, bubN);
    gl.uniform4fv(u.uBubA, bubA);
    gl.uniform4fv(u.uBubB, bubB);
    gl.uniform1f(u.uBubInk, 0.012 * BB.ink * Math.min(dt * 30, 2));
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function present(tex) {
    const m = mod(state.simTime);
    const P = currentPalette(state.simTime);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(showProg.p);
    const u = showProg.u;
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, palTex[P.i0].tex);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, palTex[P.i1].tex);
    gl.uniform1i(u.uTex, 0);
    gl.uniform1i(u.uPal0, 1);
    gl.uniform1i(u.uPal1, 2);
    gl.uniform1f(u.uPalMix, P.f);
    gl.uniform1i(u.uBubN, state.bubblesOn ? bubbles.length : 0);
    gl.uniform4fv(u.uBubA, bubA);
    gl.uniform4fv(u.uBubB, bubB);
    gl.uniform1f(u.uBubRim, BB.opacity);
    gl.uniform1f(u.uBubLens, BB.lens);
    gl.uniform1f(u.uBubThick, BB.thick);
    gl.uniform2f(u.uRes, canvas.width, canvas.height);
    gl.uniform1f(u.uTime, state.simTime);
    gl.uniform1f(u.uSat, m.sat);
    gl.uniform1f(u.uGamma, 0.95);
    gl.uniform1f(u.uGain, K.gain);
    gl.uniform1f(u.uVignette, K.vignette);
    gl.uniform1f(u.uPulse, state.fx.pulse);
    gl.uniform1f(u.uKal, state.fx.kal);
    gl.uniform1f(u.uKalSym, state.fx.kalSym);
    gl.uniform1f(u.uKalRot, state.fx.kalRot);
    gl.uniform1i(u.uEruptN, state.fx.n);
    gl.uniform4fv(u.uEruptA, eruptA);
    gl.uniform4fv(u.uEruptB, eruptB);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  // ---- adaptive quality: aim for a steady frame rate rather than max resolution
  function adapt(now, frameMs) {
    state.frameTimes.push(frameMs);
    if (state.frameTimes.length > 90) state.frameTimes.shift();
    if (now - state.lastAdapt < 3000 || state.frameTimes.length < 60) return;
    const sorted = [...state.frameTimes].sort((a, b) => a - b);
    const p75 = sorted[Math.floor(sorted.length * 0.75)];
    const budget = Math.max(1000 / state.fpsCap, 16.7);
    let s = state.renderScale;
    if (p75 > budget * 1.3 && s > 0.35) s = Math.max(0.35, s - 0.1);
    else if (p75 < budget * 1.08 && s < state.maxScale) s = Math.min(state.maxScale, s + 0.05);
    if (s !== state.renderScale) { state.renderScale = s; resize(false); }
    state.lastAdapt = now;
    state.frameTimes.length = 0;
  }

  // ---- main loop
  function frame(now) {
    requestAnimationFrame(frame);
    let rawDt = (now - state.lastNow) / 1000;
    if (!Number.isFinite(rawDt) || rawDt < 0) rawDt = 0;
    state.lastNow = now;
    if (document.hidden) return;
    // frame rate cap: skip this vsync if we are ahead of schedule
    if (state.fpsCap < 60) {
      const interval = 1000 / state.fpsCap;
      if (now - state.lastRender < interval - 2) { state.pendingDt += rawDt; return; }
      rawDt += state.pendingDt; state.pendingDt = 0;
    }
    state.lastRender = now;
    resize(false);
    if (!state.paused) {
      // clamp dt: a tab that was throttled must not lurch forward
      const dt = Math.min(rawDt, 1 / 20) * state.speed;
      state.simTime += dt;
      const P = currentPalette(state.simTime);
      updateEruptions();
      updateBubbles(dt);
      stepShapes(dt, P);
      renderLines(P);
      step(dt, targets[0].tex, targets[1], false);
      targets.reverse();
      state.frame++;
    }
    present(targets[0].tex);
    adapt(now, rawDt * 1000);
  }

  function setPaused(v) { state.paused = !!v; }
  window.__acidPause = setPaused;

  // ---- UI: fullscreen, keys, cursor hiding
  let hintTimer = 0, idleTimer = 0;
  function showHint(ms) {
    hint.classList.remove('hidden');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => hint.classList.add('hidden'), ms);
  }
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add('idle'), 2500);
  }
  function toggleFullscreen() {
    const el = document.documentElement;
    if (!document.fullscreenElement) (el.requestFullscreen || el.webkitRequestFullscreen).call(el).catch(() => {});
    else document.exitFullscreen();
  }
  canvas.addEventListener('click', toggleFullscreen);
  canvas.addEventListener('dblclick', e => e.preventDefault());
  window.addEventListener('mousemove', () => { wake(); });
  window.addEventListener('keydown', e => {
    wake();
    const k = e.key.toLowerCase();
    if (k === ' ') { state.paused = !state.paused; e.preventDefault(); }
    else if (k === 'f') toggleFullscreen();
    else if (k === 'a') { state.autoPalette = true; showHint(2500); }
    else if (k === 's') { state.speed = state.speed >= 2 ? 0.5 : state.speed * 2; showHint(2500); }
    else if (k === 'm') { state.linesOn = !state.linesOn; }
    else if (k === 'o') { state.bubblesOn = !state.bubblesOn; }
    else if (k === 'n') { spawnBubble(); }
    else if (k === 'p') { popAll(); }
    else if (k === 'e') { spawnEruption(); }
    else if (k === 'b') { startBreakthrough(); }
    else if (k === 't') { spawnEruption(true); }
    else if (k === 'r') { state.frame = 0; }
    else if (k === 'h') { hint.classList.toggle('hidden'); clearTimeout(hintTimer); }
    else if (k >= '1' && k <= '9') { state.autoPalette = false; state.paletteIndex = (parseInt(k, 10) - 1) % PALETTES.length; }
  });
  window.addEventListener('resize', () => resize(false));
  document.addEventListener('visibilitychange', () => { state.lastNow = performance.now(); });
  gl.canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); });
  gl.canvas.addEventListener('webglcontextrestored', () => { location.reload(); });

  async function keepAwake() {
    try { if ('wakeLock' in navigator && !document.hidden) await navigator.wakeLock.request('screen'); } catch (_) {}
  }

  // ---- URL parameters (override the settings file)
  const qs = new URLSearchParams(location.search);
  const saverMode = qs.get('saver') === '1';
  if (!saverMode) { document.addEventListener('visibilitychange', keepAwake); keepAwake(); }
  if (qs.has('fps')) state.fpsCap = clamp(parseInt(qs.get('fps'), 10) || 60, 10, 60);
  if (qs.has('maxscale')) state.maxScale = clamp(parseFloat(qs.get('maxscale')) || 1, 0.35, 1);
  if (qs.has('speed')) state.speed = clamp(parseFloat(qs.get('speed')) || 1, 0.05, 8);
  if (qs.has('scale')) state.renderScale = clamp(parseFloat(qs.get('scale')) || 0.75, 0.25, 1);
  state.renderScale = Math.min(state.renderScale, state.maxScale);
  if (qs.has('palette')) { state.autoPalette = false; state.paletteIndex = clamp((parseInt(qs.get('palette'), 10) || 1) - 1, 0, PALETTES.length - 1); }
  if (qs.get('hint') === '0' || saverMode) hint.style.display = 'none';
  window.__acid = state;
  window.__acidSettings = S;
  window.__acidEruptions = eruptions;
  window.__acidBubbles = bubbles;
  window.__acidSpawnBubble = spawnBubble;
  window.__acidPopAll = popAll;

  resize(true);
  showHint(6000);
  wake();
  requestAnimationFrame(frame);
}

// Bootstrap: when served over http(s), try settings.json next to the page first
// (file:// pages cannot read sibling files; the .scr host injects window.ACID_SETTINGS_TEXT instead).
if (typeof window.ACID_SETTINGS_TEXT !== 'string' && /^https?:$/.test(location.protocol)) {
  fetch('settings.json', { cache: 'no-store' })
    .then(r => r.ok ? r.text() : null)
    .then(text => { if (text) window.ACID_SETTINGS_TEXT = text; acidMain(); })
    .catch(acidMain);
} else {
  acidMain();
}
</script>
</body>
</html>
